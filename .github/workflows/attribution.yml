name: Attribution

# No assistant attribution may enter this repository: no co-author trailers,
# "Generated with" footers, assistant session links or assistant identities, in
# any commit, pull request title or body, or their edit history. Every event is
# checked; none is skipped and nothing is exempt.
#
# The policy lives in this repository (tools/attribution): it builds and runs
# from here alone, with nothing fetched from another project. It is a copy of
# aimee's attribution policy so the two refuse the same things; when one
# changes, port the change to the other.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Only the protected branch: a push that creates a branch has an all-zero
  # "before", which the policy refuses, and that rejection would stay recorded
  # on the commit and fail its pull request forever. Work branches are checked
  # through their pull request instead.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full base commit SHA to compare
        required: true
        type: string
      head_sha:
        description: Full incoming commit SHA to verify
        required: true
        type: string

concurrency:
  group: attribution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-coauthor-trailers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: tools/attribution
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: tools/attribution/go.mod
          cache: false
      - name: Test the attribution policy
        working-directory: tools/attribution
        run: go vet ./... && go test -count=1 ./...
      - name: Enforce attribution across incoming commits and PR history
        working-directory: tools/attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run .
